<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>
<body>


    Nama: <i id="value_nama"></i>
    <br>
    Nama: <i id="value_umur"></i> tahun

    <script>
        // String Variable
        var nama = "Ila";
        
        // Number Variable
        let umur = 19;
        let tinggi = 175;
        
        // Array
        let film_fvorit = ["Spiderman", "dll"];
        
        // Console.log
        console.log("Nama: " + nama);
        console.log("Umur: " + umur);
        console.log("Tinggi: " + tinggi);
        
        // Arithmetic Operation
        let x = 0.9;
        let y = 0.01;
        
        let jumlah = x + y;
        console.log("Hasil penjumlahan x & y: " + jumlah);
        
        let kurang = x - y;
        console.log("Hasil pengurangan x & y: " + kurang);
        
        let kali = x * y;
        console.log("Hasil perkalian x & y: " + kali);
        
        let bagi = x / y;
        console.log("Hasil pembagian x & y: " + bagi);
        
        let sisa = x % y;
        console.log("Hasil sisa pembagian x & y: " + sisa);
        
        let pangkat = x ** y;
        console.log("Hasil perpangkatan x & y: " + pangkat);
        //Kondisional Statement
        let nilai = 97

        if (nilai >=90) {
            console.log("Nilai Anda: A");
        }
        else if (nilai >=80) {
            console.log("Nilai Anda: B");
        }
        else if (nilai >=70) {
            console.log("Nilai Anda: C");
        }
        else  {
            console.log("Nilai Anda: D");
        }

        //Looping
        for (let i = 4; i <=70; i++){
            console.log(i);
        }

        //funciton
        function penjumlahan (x, y){
            return console.log("Hasil penjumlahan: " + (x + y))
        }
        //memanggil fungsi penjumlahan
        penjumlahan (0.009, 91)

        //menampilkan nama ke halaman web (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur + "tahun";
    </script>

</body>
</html>
